<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAUS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef0f6">
<meta name="description" content="Was ziehe ich an? Sportoutfit nach Wetter für Rennvelo, Joggen und Schwimmen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RAUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: eine Spalte, Telefon zuerst. Blaue Wetterkarte, runde Sport-Buttons, Urteilskarte, Stundenleiste, Outfit-Liste, Werte. */
:root {
  --bg: #eef0f6;
  --card: #ffffff;
  --ink: #14161f;
  --muted: #8a90a6;
  --line: #e6e8f0;
  --blue: #2747e8;
  --blue-soft: #e9edff;
  --blue-pale: #cdd6ff;
  --yellow: #ffd23f;
  --yellow-soft: #fff3c4;
  --red: #ff3b5c;
  --red-soft: #ffe1e7;
  --sun: #ffc21a;
  --shadow: 0 10px 24px rgba(39, 71, 232, .08);
  --shadow-blue: 0 14px 30px rgba(39, 71, 232, .32);
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
svg { display: block; }

.app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
}
.view { display: grid; gap: 16px; }
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); }

/* Kopf */
.top { display: flex; align-items: center; gap: 10px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: .06em; color: var(--blue); }
.place { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place svg { flex: none; }
.rbtn { width: 42px; height: 42px; flex: none; border: 0; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(39, 71, 232, .12); color: var(--blue); }
.rbtn svg { width: 20px; height: 20px; }
.rbtn[aria-busy="true"] svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Wetterkarte */
.hero { background: var(--blue); color: #fff; border-radius: 22px; padding: 18px 20px 20px; box-shadow: var(--shadow-blue); }
.pill { display: inline-block; background: #fff; color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px; }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.hero-icon svg { width: 112px; height: 84px; }
.hero-temp { text-align: right; min-width: 0; }
.big { font-size: 72px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.big.word { font-size: 32px; font-weight: 700; }
.hero-sub { font-size: 13px; opacity: .88; margin-top: 6px; }

/* Sportarten */
.sports { display: flex; justify-content: space-between; padding: 0 4px; }
.sport { border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.sport .c { width: 68px; height: 68px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 8px 18px rgba(39, 71, 232, .12); color: var(--blue); transition: background .2s, color .2s; }
.sport .c svg { width: 34px; height: 34px; }
.sport[aria-pressed="true"] { color: var(--blue); }
.sport[aria-pressed="true"] .c { background: var(--blue); color: #fff; box-shadow: var(--shadow-blue); }

/* Urteil */
.verdict { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.verdict-main { min-width: 0; }
.tag { display: inline-block; background: var(--yellow); color: var(--ink); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 5px; }
.vtext { font-size: 40px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; margin-top: 6px; }
.vsub { font-size: 12px; color: var(--muted); }
.verdict.stop { background: var(--red); color: #fff; box-shadow: 0 14px 30px rgba(255, 59, 92, .32); }
.verdict.stop .tag { background: #fff; color: var(--red); }
.verdict.stop .vtext { font-size: clamp(26px, 8.5vw, 34px); }
.verdict.stop .vsub { color: #ffe1e7; }
.verdict.stop .step { display: none; }
.verdict.empty .vtext { font-size: 28px; }
.step { display: grid; justify-items: center; gap: 6px; flex: none; }
.step .v { background: var(--blue); color: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 15px; line-height: 1.2; text-align: center; min-width: 58px; font-variant-numeric: tabular-nums; }
.step .v small { display: block; font-size: 11px; font-weight: 500; }
.step .r { display: flex; gap: 8px; }
.step .r button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; font-weight: 600; color: var(--blue); font-size: 17px; line-height: 1; }

/* Hinweise */
.hints { display: grid; gap: 10px; }
.hint { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-size: 13px; font-weight: 500; }
.hint .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--yellow-soft); color: var(--ink); }
.hint.stop .ic { background: var(--red-soft); color: var(--red); }
.hint .ic svg { width: 18px; height: 18px; }

/* Stundenleiste */
.hours { display: flex; overflow-x: auto; scrollbar-width: none; }
.hours::-webkit-scrollbar { display: none; }
.h { flex: 1 0 25%; display: grid; justify-items: center; gap: 6px; padding: 14px 4px 16px; font-size: 12px; }
.h b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.h .lbl { color: var(--muted); font-size: 11px; }
.h svg { width: 44px; height: 34px; }
.h .t { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.h.on { background: var(--blue); color: #fff; border-radius: 16px; }
.h.on .lbl { color: var(--blue-pale); }

/* Outfit */
h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 4px 4px -6px; }
.outfit { list-style: none; margin: 0; padding: 6px 0; }
.o { display: flex; align-items: center; gap: 14px; padding: 10px 16px; font-size: 14px; font-weight: 500; line-height: 1.3; border-bottom: 1px solid var(--line); }
.o:last-child { border-bottom: 0; }
.o .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.o .ic svg { width: 20px; height: 20px; }
.o.rain .ic { background: var(--yellow-soft); color: var(--ink); }
.o .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.outfit.dim { opacity: .5; }

/* Werte */
.facts { display: flex; justify-content: space-between; padding: 0 2px; }
.f { display: grid; justify-items: center; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-align: center; }
.f .c { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.f .c.light { background: var(--card); color: var(--blue); box-shadow: 0 6px 14px rgba(39, 71, 232, .12); }
.f .c svg { width: 26px; height: 26px; }
.f b { font-size: 14px; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.status { text-align: center; font-size: 12px; color: var(--muted); }
.status.warn { color: var(--red); }

details { padding: 14px 18px; }
summary { color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.fine { color: var(--muted); font-size: 12.5px; display: grid; gap: 8px; margin-top: 10px; }
.fine p { margin: 0; }
.fine a { color: var(--blue); }

/* Einstellungen */
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h1 { font-size: 24px; font-weight: 700; margin: 0; }
.field { padding: 16px; display: grid; gap: 10px; }
.flabel { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.text { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.results button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 14px; }
.limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.limits label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.primary { border: 0; border-radius: 16px; padding: 15px; background: var(--blue); color: #fff; font-weight: 600; font-size: 16px; box-shadow: var(--shadow-blue); }
.err { color: var(--red); font-size: 13px; margin: 0; }

@media (max-width: 360px) {
  .sport .c { width: 58px; height: 58px; }
  .f .c { width: 48px; height: 48px; }
  .big { font-size: 60px; }
  .limits { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">

  <main class="view" id="main">
    <header class="top">
      <span class="logo">RAUS</span>
      <span class="place"><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 0a7 7 0 0 1 7 7c0 5-7 11-7 11S0 12 0 7a7 7 0 0 1 7-7Z" fill="var(--blue)"/><circle cx="7" cy="7" r="2.6" fill="#fff"/></svg><span id="placeName">Frauenfeld</span></span>
      <button class="rbtn" id="refresh" aria-label="Wetter neu laden"><svg data-i="refresh"></svg></button>
      <button class="rbtn" id="openSettings" aria-label="Einstellungen"><svg data-i="sliders"></svg></button>
    </header>

    <section class="hero" aria-live="polite">
      <span class="pill" id="datePill">Heute</span>
      <div class="hero-row">
        <div class="hero-icon" id="heroIcon"></div>
        <div class="hero-temp">
          <div class="big" id="temp">–°</div>
          <div class="hero-sub" id="heroSub">Lade Wetter …</div>
        </div>
      </div>
    </section>

    <div class="sports" role="group" aria-label="Sportart" id="sportSeg">
      <button class="sport" data-sport="bike"><span class="c"><svg data-i="bike"></svg></span>VELO</button>
      <button class="sport" data-sport="run"><span class="c"><svg data-i="run"></svg></span>JOGGEN</button>
      <button class="sport" data-sport="swim"><span class="c"><svg data-i="swim"></svg></span>SCHWIMMEN</button>
    </div>

    <section class="card verdict" id="verdictCard" aria-live="polite">
      <div class="verdict-main">
        <span class="tag" id="tag">Jetzt</span>
        <div class="vtext" id="verdict">RAUS</div>
        <div class="vsub" id="vsub">Lade Wetter …</div>
      </div>
      <div class="step">
        <span class="v"><span id="durVal">60</span><small>Min.</small></span>
        <span class="r">
          <button id="durMinus" aria-label="15 Minuten weniger">−</button>
          <button id="durPlus" aria-label="15 Minuten mehr">+</button>
        </span>
      </div>
    </section>

    <div class="hints" id="hints"></div>

    <section class="card hours" id="hours" aria-label="Stunden im Trainingsfenster"></section>

    <h2 id="outfitTitle">Anziehen &amp; mitnehmen</h2>
    <ul class="card outfit" id="outfit"></ul>

    <section class="facts" id="facts"></section>
    <p class="status" id="status"></p>

    <details class="card">
      <summary>So rechnet RAUS</summary>
      <div class="fine" id="fine"></div>
    </details>
  </main>

  <section class="view" id="settings" hidden aria-label="Einstellungen">
    <div class="sheet-head">
      <h1>Einstellungen</h1>
      <button class="rbtn" id="closeSettings" aria-label="Schliessen"><svg data-i="close"></svg></button>
    </div>

    <div class="card field">
      <label class="flabel" for="placeInput">Startort</label>
      <input class="text" id="placeInput" type="search" autocomplete="off" placeholder="Ort oder Postleitzahl">
      <ul class="results" id="placeResults"></ul>
      <p class="err" id="placeErr" hidden></p>
    </div>

    <div class="card field">
      <span class="flabel">Schwimmen</span>
      <div class="seg" role="group" aria-label="Wo schwimmst du?" id="kindSeg">
        <button data-kind="indoor">Hallenbad</button>
        <button data-kind="open">Freiwasser</button>
      </div>
    </div>

    <div class="card field">
      <span class="flabel">Joggen: Intensität</span>
      <div class="seg" role="group" aria-label="Intensität" id="intSeg">
        <button data-int="easy">Locker</button>
        <button data-int="hard">Intensiv</button>
      </div>
    </div>

    <div class="card field">
      <span class="flabel">Kälteempfinden</span>
      <div class="seg" role="group" aria-label="Kälteempfinden" id="sensSeg">
        <button data-sens="-3">Friere schnell</button>
        <button data-sens="0">Normal</button>
        <button data-sens="3">Schnell warm</button>
      </div>
    </div>

    <div class="card field">
      <span class="flabel">Persönliche Warnschwellen</span>
      <div class="limits">
        <label for="limRain">Regen: drinnen ab (mm/h)<input class="text" id="limRain" inputmode="decimal"></label>
        <label for="limGustWarn">Böen: Hinweis ab (km/h)<input class="text" id="limGustWarn" inputmode="numeric"></label>
        <label for="limGustStop">Böen: verschieben ab (km/h)<input class="text" id="limGustStop" inputmode="numeric"></label>
        <label for="limLight">Lichtpuffer (Min.)<input class="text" id="limLight" inputmode="numeric"></label>
      </div>
      <p class="err" id="limErr" hidden></p>
    </div>

    <button class="primary" id="saveSettings">Speichern</button>
  </section>

</div>

<script>
"use strict";

// ---------- Konstanten (aus dem Scriptable-Skript übernommen) ----------
const SPORT = { bike: "Rennvelo", run: "Joggen", swim: "Schwimmen" };
const DEFAULTS = { rain: 5, gustWarn: 40, gustStop: 50, lightBuffer: 30 };
const CURRENT = ["temperature_2m","apparent_temperature","precipitation","weather_code","wind_speed_10m","wind_gusts_10m","is_day"];
const HOURLY = [...CURRENT, "precipitation_probability", "rain", "showers"];
const KEY_SETTINGS = "raus.settings.v4";
const KEY_CACHE = "raus.weather.v1";
const IN_FRAME = window.self !== window.top;

const DEFAULT_SETTINGS = {
  version: 4, sport: "run", kind: "open", intensity: "easy",
  place: { name: "Frauenfeld", latitude: 47.5536, longitude: 8.8987, timezone: "Europe/Zurich" },
  duration: 60, sensitivity: 0, thresholds: { ...DEFAULTS }
};

// ---------- Linien-Icons ----------
const I = {
  refresh: "M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7",
  sliders: "M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4",
  close: "M6 6l12 12M18 6L6 18",
  bike: "M5.5 20a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM18.5 20a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM5.5 16.5 10 9h6l2.5 7.5M10 9 8.5 6H7M12 16.5 16 9",
  run: "M14 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM6 21l4-6 3 2v4M8 11l3-4 4 2 2 3h3M11 7l-1 5",
  swim: "M2 18c2 0 2 1.5 5 1.5s3-1.5 5-1.5 3 1.5 5 1.5 3-1.5 5-1.5M6 14l5-5 4 3M17 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z",
  shirt: "M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0Z",
  pants: "M7 3h10l1 18h-4l-2-11-2 11H6Z",
  glove: "M8 21v-6l-3-3 1.2-1.2L8 12V5.5a1.2 1.2 0 0 1 2.4 0V11V4.5a1.2 1.2 0 0 1 2.4 0V11V5.5a1.2 1.2 0 0 1 2.4 0V12V8.5a1.2 1.2 0 0 1 2.4 0V15c0 3.5-2 6-5 6Z",
  cap: "M4 15a8 8 0 0 1 16 0ZM2 15h20v2H2Z",
  jacket: "M9 3 4 6v15h5v-9M15 3l5 3v15h-5v-9M9 3c1 2 5 2 6 0M12 6v15",
  shoe: "M3 17h18v-2l-6-2-2-4H8l-5 4ZM3 17v2h18v-2",
  rain: "M7 15a4 4 0 0 1-.3-8A5.5 5.5 0 0 1 17 7.5 3.8 3.8 0 0 1 17 15ZM8 18l-1 3M12 18l-1 3M16 18l-1 3",
  wind: "M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7",
  storm: "M7 14a4 4 0 0 1-.3-8A5.5 5.5 0 0 1 17 6.5 3.8 3.8 0 0 1 17 14M12 13l-2 4h4l-2 4",
  light: "M8 2h8v5l-2 3v12h-4V10L8 7ZM12 14v2",
  snow: "M12 2v20M4 7l16 10M20 7 4 17M9 3l3 2 3-2M9 21l3-2 3 2",
  goggles: "M2 12a3 3 0 0 0 3 3h2.5l2-2h5l2 2H19a3 3 0 0 0 0-6H5a3 3 0 0 0-3 3Z",
  towel: "M5 3h14v18H5ZM5 8h14M9 13h6",
  buoy: "M12 3a9 9 0 1 0 .01 0ZM12 8a4 4 0 1 0 .01 0ZM5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6",
  waves: "M2 9c2 0 2 2 5 2s3-2 5-2 3 2 5 2 3-2 5-2M2 15c2 0 2 2 5 2s3-2 5-2 3 2 5 2 3-2 5-2",
  moon: "M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10Z",
  umbrella: "M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9ZM12 12v7a2 2 0 0 1-4 0",
  thermo: "M14 14V5a2 2 0 0 0-4 0v9a4 4 0 1 0 4 0Z",
  warn: "M12 3 2 21h20ZM12 10v5M12 18h0"
};
const SYMBOL = {
  "figure.pool.swim":"swim","figure.open.water.swim":"swim","eyeglasses":"goggles","square":"towel","shoe":"shoe",
  "lifepreserver":"buoy","jacket":"jacket","tshirt":"shirt","figure.outdoor.cycle":"pants","figure.run":"pants",
  "hand.raised":"glove","cap":"cap","wind":"wind","cloud.rain":"rain","cloud.rain.fill":"rain",
  "cloud.bolt.rain.fill":"storm","snowflake":"snow","flashlight.on.fill":"light","cloud.snow.fill":"snow",
  "moon.fill":"moon","water.waves":"waves"
};
function svg(name, extra = "") {
  const d = I[SYMBOL[name] || name] || I.warn;
  return `<svg ${extra} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
}
document.querySelectorAll("svg[data-i]").forEach(el => { el.outerHTML = svg(el.dataset.i); });

// ---------- Farbige Wetter-Icons ----------
// kind: sun | moon | cloudsun | cloudmoon | cloud | rain | storm | snow | fog
// onBlue: Wolke weiss auf blauem Grund, sonst blau.
function wxIcon(kind, onBlue) {
  const cloud = onBlue ? "#fff" : "var(--blue)";
  const sunC = "var(--sun)";
  const sun = `<circle cx="24" cy="18" r="11" fill="${sunC}"/><g stroke="${sunC}" stroke-width="3" stroke-linecap="round"><path d="M24 1v4M8 7l3 3M3 20h4M40 7l-3 3"/></g>`;
  const moon = `<path d="M30 6a13 13 0 1 0 8 22A11 11 0 0 1 30 6Z" fill="${sunC}"/>`;
  const smallCloud = `<path d="M18 44a10 10 0 0 1-1-20 13 13 0 0 1 25-2 10 10 0 0 1 9 11 9 9 0 0 1-3 11Z" fill="${cloud}"/>`;
  const bigCloud = `<path d="M16 38a11 11 0 0 1-1-22 15 15 0 0 1 28-3 11 11 0 0 1 10 12 10 10 0 0 1-4 13Z" fill="${cloud}"/>`;
  const drops = `<g stroke="${onBlue ? "#cdd6ff" : "var(--blue)"}" stroke-width="3" stroke-linecap="round"><path d="M22 42l-2 4M32 42l-2 4M42 42l-2 4"/></g>`;
  const flakes = `<g fill="${onBlue ? "#fff" : "var(--blue)"}"><circle cx="21" cy="44" r="2"/><circle cx="31" cy="45" r="2"/><circle cx="41" cy="44" r="2"/></g>`;
  const bolt = `<path d="M33 30l-6 10h5l-3 8 9-12h-5l3-6Z" fill="${sunC}"/>`;
  const fog = `<g stroke="${cloud}" stroke-width="4" stroke-linecap="round"><path d="M8 20h44M14 30h40M8 40h36"/></g>`;
  const parts = {
    sun: `<g transform="translate(8 6)">${sun}</g>`,
    moon: `<g transform="translate(4 4)">${moon}</g>`,
    cloudsun: sun + smallCloud,
    cloudmoon: `<g transform="translate(-6 -2)">${moon}</g>` + smallCloud,
    cloud: bigCloud,
    rain: `<g transform="translate(0 -4)">${bigCloud}</g>` + drops,
    storm: `<g transform="translate(0 -6)">${bigCloud}</g>` + bolt,

}
function wxKind(code, day) {
  if (code >= 95) return "storm";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
  if (code >= 51) return "rain";
  if (code >= 45) return "fog";
  if (code === 3) return "cloud";
  if (code > 0) return day ? "cloudsun" : "cloudmoon";
  return day ? "sun" : "moon";
}
function weatherWord(code) {
  if (code >= 95) return "Gewitter";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "Schnee";
  if (code >= 80) return "Schauer";
  if (code >= 61) return "Regen";
  if (code >= 51) return "Niesel";
  if (code >= 45) return "Nebel";
  if (code === 3) return "Bedeckt";
  if (code > 0) return "Wolkig";
  return "Klar";
}

// ---------- Speicher ----------
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
function limits(s) { return { ...DEFAULTS, ...(s.thresholds || {}) }; }
function validLimits(t) {
  return Number.isFinite(t.rain) && t.rain >= 0.5 && t.rain <= 30 &&
    Number.isFinite(t.gustWarn) && t.gustWarn >= 10 && t.gustWarn <= 100 &&
    Number.isFinite(t.gustStop) && t.gustStop > t.gustWarn && t.gustStop <= 120 &&
    Number.isInteger(t.lightBuffer) && t.lightBuffer >= 0 && t.lightBuffer <= 120;
}
function loadSettings() {
  const s = store.get(KEY_SETTINGS);
  if (!s || !SPORT[s.sport] || !s.place || !Number.isFinite(s.place.latitude)) return clone(DEFAULT_SETTINGS);
  return { ...clone(DEFAULT_SETTINGS), ...s, thresholds: limits(s) };
}

// ---------- Netzwerk ----------
function url(base, params) {
  return base + "?" + Object.entries(params).map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");
}
async function getJSON(address) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  let r, data;
  try {
    r = await fetch(address, { signal: ctrl.signal, cache: "no-store" });
    data = await r.json();
  } catch (_) {
    throw new Error("Wetterdienst nicht erreichbar. Bitte erneut versuchen.");
  } finally { clearTimeout(timer); }
  if (!data || data.error || !r.ok) throw new Error("Der Wetterdienst konnte die Anfrage nicht beantworten.");
  return data;
}
async function fetchForecast(place) {
  return getJSON(url("https://api.open-meteo.com/v1/forecast", {
    latitude: place.latitude, longitude: place.longitude,
    current: CURRENT.join(","), hourly: HOURLY.join(","), daily: "sunrise,sunset",
    forecast_days: 3, timezone: place.timezone, timeformat: "unixtime",
    temperature_unit: "celsius", wind_speed_unit: "kmh", precipitation_unit: "mm"
  }));
}

// ---------- Wetter und Trainingszeitraum (unverändert portiert) ----------
function summarize(data, s, start) {
  const end = start + s.duration * 60;
  const c = data.current, h = data.hourly, d = data.daily;
  const bad = () => { throw new Error("Keine vollständigen, aktuellen Wetterdaten verfügbar."); };
  if (!c || CURRENT.some(k => !Number.isFinite(c[k])) || !Number.isFinite(c.time) ||
      start - c.time > 1800 || c.time > start + 300 || !h || !Array.isArray(h.time) ||
      h.time.length < 2 || h.time[0] > start || h.time[h.time.length - 1] < end) bad();
  if (h.time.some((t, i) => !Number.isFinite(t) || (i && t - h.time[i - 1] !== 3600))) bad();

  const rows = [];
  h.time.forEach((time, i) => {
    if (time > start && time - 3600 < end) {
      const r = { time };
      HOURLY.forEach(k => { r[k] = h[k] && h[k][i]; });
      rows.push(r);
    }
  });
  if (!rows.length || rows.some(r => HOURLY.some(k => !Number.isFinite(r[k])))) bad();

  const points = [c, ...rows];
  const max = k => Math.max(...points.map(r => r[k]));
  const min = k => Math.min(...points.map(r => r[k]));
  const sunOK = d && Array.isArray(d.sunrise) && Array.isArray(d.sunset) &&
    d.sunrise.length === d.sunset.length && d.sunrise.length > 0 &&
    d.sunrise.every((v, i) => Number.isFinite(v) && Number.isFinite(d.sunset[i]) && v < d.sunset[i]);
  const daylightOnly = sunOK && d.sunrise.some((rise, i) => start >= rise && end < d.sunset[i] - limits(s).lightBuffer * 60);

  return {
    current: c, start, end, sunOK,
    light: !daylightOnly || c.is_day === 0,
    feel: min("apparent_temperature"), min: min("temperature_2m"), max: max("temperature_2m"),
    wind: max("wind_speed_10m"), gust: max("wind_gusts_10m"),
    rainRate: Math.max(...rows.map(r => r.rain + r.showers)),
    rainChance: Math.max(...rows.map(r => r.precipitation_probability)),
    wet: points.some(r => r.precipitation > 0),
    storm: points.some(r => [95, 96, 99].includes(r.weather_code)),
    fog: points.some(r => [45, 48].includes(r.weather_code)),
    ice: points.some(r => [56, 57, 66, 67].includes(r.weather_code)) ||
      (min("temperature_2m") <= 1 && points.some(r => r.precipitation > 0)),
    snow: points.some(r => [71, 73, 75, 77, 85, 86].includes(r.weather_code))
  };
}

// ---------- Empfehlungen (unverändert portiert) ----------
function recommend(s, w) {
  const items = [], hints = [];
  const add = (symbol, short, full = short, priority = 5) => items.push({ symbol, short, full, priority });
  const hint = (symbol, short, full, stop = false) => hints.push({ symbol, short, full, stop });

  if (s.sport === "swim" && s.kind === "indoor") {
    add("figure.pool.swim", "Badekleidung", "Badeanzug oder Badehose", 1);
    add("eyeglasses", "Brille + Kappe", "Schwimmbrille und Badekappe", 2);
    add("square", "Handtuch", "Handtuch und trockene Kleidung", 3);
    add("shoe", "Badeschuhe", "Badeschuhe", 4);
    return { items, hints, stop: false };
  }

  const t = limits(s);
  if (w.storm) hint("cloud.bolt.rain.fill", "Gewitter: verschieben", "Gewitter im Prognosefenster: Outdoor-Training verschieben.", true);
  if (w.gust >= t.gustStop) hint("wind", "Böen: verschieben", "Böen bis " + Math.round(w.gust) + " km/h: besser drinnen trainieren.", true);
  if (w.rainRate >= t.rain) hint("cloud.rain.fill", "Regen: lieber drinnen", "Kräftiger Regen bis " + w.rainRate.toFixed(1) + " mm in einer Stunde: besser drinnen trainieren.", true);
  if (w.ice) hint("snowflake", "Glätte: verschieben", "Mögliche Glätte oder gefrierender Niederschlag: Outdoor-Training verschieben.", true);
  if (w.gust >= t.gustWarn && w.gust < t.gustStop) hint("wind", "Böen: Strecke prüfen", "Starke Böen: Wald und exponierte Strecken meiden.");
  if (s.sport !== "swim" && (w.light || (s.sport === "bike" && (w.wet || w.fog)))) {
    hint("flashlight.on.fill",
      s.sport === "bike" ? "Licht mitnehmen" : "Licht + Reflektoren",
      s.sport === "bike" ? "Vorder- und Rücklicht mitnehmen und bei schlechter Sicht einschalten."
                         : "Lauflampe und reflektierende Kleidung oder Leuchtbänder mitnehmen.");
  }
  if (w.snow) hint("cloud.snow.fill", "Schnee: Weg prüfen", "Schnee erwartet: Wegzustand und Trittsicherheit prüfen.");
  if (w.wet || w.rainChance >= 40) hint("cloud.rain.fill", "Regen erwartet", "Regen möglich oder erwartet; Kleidung und Strecke anpassen.");

  if (s.sport === "swim") {
    add("figure.open.water.swim", "Badekleidung", "Badeanzug oder Badehose", 1);
    add("eyeglasses", "Brille + Kappe", "Schwimmbrille und Badekappe", 2);
    add("lifepreserver", "Schwimmboje", "Gut sichtbare Schwimmboje", 3);
    add("jacket", "Trockene Kleidung", "Handtuch und warme, trockene Kleidung für danach", 4);
    if (w.light) hint("moon.fill", "Dunkel: verschieben", "Freiwasserschwimmen bei Dunkelheit besser verschieben.", true);
    if (w.wind >= 20 || w.gust >= 35) hint("water.waves", "Wasserlage prüfen", "Wind, Wellen und lokale Hinweise prüfen.");
  } else {
    const temp = w.feel + s.sensitivity + (s.sport === "bike" ? -2 : s.intensity === "hard" ? 5 : 2);
    if (s.sport === "bike") {
      add("tshirt",
        temp < 5 ? "Thermotrikot" : temp < 13 ? "Langarmtrikot" : temp < 18 ? "Trikot + Armlinge" : "Kurzarmtrikot",
        temp < 5 ? "Thermo-Langarmtrikot und Baselayer" : temp < 13 ? "Langarmtrikot" : temp < 18 ? "Kurzarmtrikot und Armlinge" : "Kurzarmtrikot", 1);
      add("figure.outdoor.cycle",
        temp < 10 ? "Lange Velohose" : temp < 16 ? "Hose + Beinlinge" : "Kurze Velohose",
        temp < 10 ? "Lange Velohose" : temp < 16 ? "Kurze Velohose und Beinlinge" : "Kurze Velohose", 2);
      add("hand.raised",
        temp < 6 ? "Warme Handschuhe" : temp < 14 ? "Lange Handschuhe" : "Kurze Handschuhe",
        temp < 6 ? "Warme Langfingerhandschuhe" : temp < 14 ? "Dünne Langfingerhandschuhe" : "Kurze Velohandschuhe", 5);
      if (temp < 10) add("cap", "Unterziehkappe", "Dünne Kappe unter dem Helm", 6);
      if (temp < 10 || w.wet) add("shoe", "Überschuhe", temp < 5 ? "Warme Überschuhe" : "Leichte Überschuhe", 6);
      if (temp < 18 || w.wind >= 20) add("jacket", temp < 5 ? "Winterjacke" : "Windweste", temp < 5 ? "Winddichte Winterjacke" : "Windweste für Wind und Abfahrten", 4);
    } else {
      // Joggen: persönliche Oberteil-Regeln nach tiefster tatsächlicher Temperatur.
      add("tshirt", w.min <= 17 ? "Langarmshirt" : "Kurzarmshirt", w.min <= 17 ? "Langarm-Laufshirt" : "Kurzarm-Laufshirt", 1);
      add("figure.run", temp < 11 ? "Trainerhose" : "Laufshorts", temp < 11 ? "Lange Trainerhose" : "Laufshorts", 2);
      if (w.min < 10) add("jacket", "Hoodie", "Sport-Hoodie über dem Langarmshirt", 3);
      if (temp < 10) add("hand.raised", "Handschuhe", temp < 4 ? "Warme Laufhandschuhe" : "Dünne Laufhandschuhe", 5);
      if (temp < 11 || w.wet) add("cap", temp < 5 ? "Mütze" : temp < 11 ? "Stirnband" : "Laufkappe");
      if (temp < 3 || w.wind >= 20) add("jacket", "Windjacke", "Leichte, atmungsaktive Windjacke", 4);
    }
    if (temp < 10 && w.wind >= 15) add("wind", "Halstuch", "Dünnes Halstuch als Windschutz", 6);
    if (w.wet || w.rainChance >= 40) add("cloud.rain", "Regenjacke", "Leichte Regenjacke", 0);
  }

  items.sort((a, b) => a.priority - b.priority);
  hints.sort((a, b) => Number(b.stop) - Number(a.stop));
  return { items, hints, stop: hints.some(h => h.stop) };
}

// Kleine Zusatzzeile zur Regel, nur für die Jogging-Oberteile.
function ruleNote(item, w) {
  if (S.sport !== "run" || !w) return "";
  if (item.full === "Langarm-Laufshirt") return "tiefste Temperatur " + Math.round(w.min) + " °C, unter 17 °C";
  if (item.full === "Kurzarm-Laufshirt") return "über 17 °C";
  if (item.short === "Hoodie") return "unter 10 °C";
  return "";
}

// ---------- Hilfen ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tagText = short => short.includes(":") ? short.split(":")[0] : short;
function clock(epoch) {
  return new Intl.DateTimeFormat("de-CH", { timeZone: S.place.timezone, hour: "2-digit", minute: "2-digit" }).format(new Date(epoch * 1000));
}
function dateLabel(epoch) {
  return new Intl.DateTimeFormat("de-CH", { timeZone: S.place.timezone, weekday: "long", day: "numeric", month: "long" }).format(new Date(epoch * 1000));
}

// Beispielprognose nur für eine Vorschau in einem Rahmen, wo kein Netz erlaubt ist.
function sampleData() {
  const now = Math.floor(Date.now() / 1000);
  const c0 = now - (now % 900);
  const h0 = now - (now % 3600) - 3600;
  const time = Array.from({ length: 48 }, (_, i) => h0 + i * 3600);
  const temps = time.map((_, i) => 6 + Math.min(i, 5) * 0.5);
  const day0 = h0 - ((h0 + 3600) % 86400);
  return {
    current: { time: c0, temperature_2m: 6, apparent_temperature: 2, precipitation: 0, weather_code: 3, wind_speed_10m: 12, wind_gusts_10m: 30, is_day: 1 },
    hourly: {
      time, temperature_2m: temps, apparent_temperature: temps.map(t => t - 4),
      precipitation: time.map(() => 0), weather_code: time.map((_, i) => i % 3 ? 2 : 3),
      wind_speed_10m: time.map(() => 14), wind_gusts_10m: time.map(() => 32), is_day: time.map(() => 1),
      precipitation_probability: time.map(() => 0), rain: time.map(() => 0), showers: time.map(() => 0)
    },
    daily: { sunrise: [day0 + 7 * 3600, day0 + 31 * 3600, day0 + 55 * 3600], sunset: [day0 + 17 * 3600, day0 + 41 * 3600, day0 + 65 * 3600] }
  };
}

// ---------- Zustand und Ablauf ----------
let raw = null;
let loading = false;
const placeKey = p => p.latitude.toFixed(3) + "," + p.longitude.toFixed(3);

function cachedRaw() {
  const c = store.get(KEY_CACHE);
  return c && c.placeKey === placeKey(S.place) && c.data ? { ...c, source: "cache" } : null;
}

async function refresh(force = false) {
  if (S.sport === "swim" && S.kind === "indoor") { render(); return; }
  if (loading) return;
  const fresh = raw && raw.source === "live" && raw.placeKey === placeKey(S.place) && Date.now() - raw.fetchedAt < 10 * 60000;
  if (fresh && !force) { render(); return; }
  loading = true;
  $("refresh").setAttribute("aria-busy", "true");
  if (!raw) raw = cachedRaw();
  render();
  try {
    const data = await fetchForecast(S.place);
    raw = { data, fetchedAt: Date.now(), placeKey: placeKey(S.place), source: "live", error: null };
    store.set(KEY_CACHE, { data, fetchedAt: raw.fetchedAt, placeKey: raw.placeKey });
  } catch (e) {
    const fallback = cachedRaw();
    if (fallback) raw = { ...fallback, error: e.message };
    else if (IN_FRAME) raw = { data: sampleData(), fetchedAt: Date.now(), placeKey: placeKey(S.place), source: "sample" };
    else raw = { data: null, error: e.message, source: "none" };
  } finally {
    loading = false;
    $("refresh").removeAttribute("aria-busy");
    render();
  }
}

function compute() {
  if (S.sport === "swim" && S.kind === "indoor") {
    return { w: null, rec: recommend(S, null), start: Date.now() / 1000, stale: false };
  }
  if (!raw || !raw.data) return null;
  const now = Date.now() / 1000;
  try {
    const w = summarize(raw.data, S, now);
    return { w, rec: recommend(S, w), start: now, stale: false };
  } catch (_) {
    try {
      const t = raw.data.current.time;
      const w = summarize(raw.data, S, t);
      return { w, rec: recommend(S, w), start: t, stale: true };
    } catch (e) { return { error: e.message }; }
  }
}

// ---------- Darstellung ----------
function renderHours(start, end) {
  const h = raw && raw.data && raw.data.hourly;
  if (!h) { $("hours").hidden = true; return; }
  const first = start - (start % 3600);
  const last = Math.max(first + 3 * 3600, end);
  const cols = [];
  h.time.forEach((t, i) => {
    if (t >= first && t <= last && cols.length < 8) {
      const on = t + 3600 > start && t < end;
      const code = h.weather_code[i];
      cols.push(`<div class="h${on ? " on" : ""}"><b>${clock(t)}</b><span class="lbl">${weatherWord(code)}</span>${wxIcon(wxKind(code, h.is_day[i]), on)}<span class="t">${Math.round(h.temperature_2m[i])}°</span></div>`);
    }
  });
  $("hours").hidden = !cols.length;
  $("hours").innerHTML = cols.join("");
}

function render() {
  document.querySelectorAll("#sportSeg .sport").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sport === S.sport)));
  $("durVal").textContent = S.duration;
  $("placeName").textContent = S.place.name;

  const m = compute();
  const card = $("verdictCard"), status = $("status");
  status.className = "status";

  if (!m || m.error) {
    $("datePill").textContent = dateLabel(Date.now() / 1000);
    $("heroIcon").innerHTML = wxIcon("cloud", true);
    $("temp").textContent = "–°"; $("temp").className = "big";
    $("heroSub").textContent = loading ? "Lade Wetter …" : "Keine Daten";
    card.className = "card verdict empty";
    $("tag").textContent = loading ? "Moment" : "Offline";
    $("verdict").textContent = loading ? "…" : "Kein Wetter";
    $("vsub").textContent = loading ? "Lade Wetter für " + S.place.name + " …" : ((raw && raw.error) || (m && m.error) || "Noch keine Daten.");
    $("hints").innerHTML = ""; $("hours").hidden = true; $("facts").innerHTML = "";
    $("outfit").innerHTML = ""; $("outfitTitle").hidden = true; $("outfit").hidden = true;
    status.textContent = loading ? "" : "Mit Netz neu laden.";
    $("fine").innerHTML = fineText(null);
    return;
  }
  $("outfitTitle").hidden = false; $("outfit").hidden = false;

  const { w, rec, start } = m;
  const end = start + S.duration * 60;
  $("datePill").textContent = dateLabel(start);

  // Wetterkarte
  if (w) {
    $("heroIcon").innerHTML = wxIcon(wxKind(w.current.weather_code, w.current.is_day), true);
    $("temp").textContent = Math.round(w.current.temperature_2m) + "°"; $("temp").className = "big";
    $("heroSub").textContent = "Gefühlt " + Math.round(w.current.apparent_temperature) + "° · " + weatherWord(w.current.weather_code);
  } else {
    $("heroIcon").innerHTML = `<span style="color:#fff">${svg("swim", 'width="84" height="84"')}</span>`;
    $("temp").textContent = "Hallenbad"; $("temp").className = "big word";
    $("heroSub").textContent = "Kein Wetter nötig";
  }

  // Urteil: passt, passt mit Hinweis, verschieben
  const span = SPORT[S.sport] + " " + clock(start) + "–" + clock(end);
  if (rec.stop) {
    const first = rec.hints[0];
    card.className = "card verdict stop";
    $("tag").textContent = tagText(first.short);
    $("verdict").textContent = "VERSCHIEBEN";
    $("vsub").textContent = first.full;
  } else if (rec.hints.length) {
    card.className = "card verdict warn";
    $("tag").textContent = tagText(rec.hints[0].short);
    $("verdict").textContent = "RAUS";
    $("vsub").textContent = span + " · mit Hinweis";
  } else {
    card.className = "card verdict";
    $("tag").textContent = "Jetzt";
    $("verdict").textContent = "RAUS";
    $("vsub").textContent = span + " · passt";
  }

  // Hinweise (der erste steckt bei VERSCHIEBEN schon in der Karte)
  const shown = rec.stop ? rec.hints.slice(1) : rec.hints;
  $("hints").innerHTML = shown.map(h =>
    `<div class="card hint${h.stop ? " stop" : ""}"><span class="ic">${svg(h.symbol)}</span><span>${esc(h.full)}</span></div>`).join("");

  // Stunden
  if (w) renderHours(start, end); else $("hours").hidden = true;

  // Outfit
  $("outfitTitle").textContent = rec.stop ? "Falls du trotzdem gehst" : "Anziehen & mitnehmen";
  $("outfit").className = "card outfit" + (rec.stop ? " dim" : "");
  $("outfit").innerHTML = rec.items.map(i => {
    const note = ruleNote(i, w);
    return `<li class="o${i.symbol.startsWith("cloud.rain") ? " rain" : ""}"><span class="ic">${svg(i.symbol)}</span><span>${esc(i.full)}${note ? `<span class="sub">${esc(note)}</span>` : ""}</span></li>`;
  }).join("");

  // Werte
  if (w) {
    const f = (icon, label, value, light) =>
      `<div class="f"><span class="c${light ? " light" : ""}">${svg(icon)}</span>${label}<b>${value}</b></div>`;
    $("facts").innerHTML =
      f("umbrella", "REGEN", Math.round(w.rainChance) + " %") +
      f("wind", "WIND", Math.round(w.wind) + " km/h") +
      f("waves", "BÖEN", Math.round(w.gust) + " km/h") +
      f("thermo", "GEFÜHLT", Math.round(w.feel) + " °C", true);
  } else {
    $("facts").innerHTML = "";
  }

  // Stand
  if (raw && raw.source === "sample") {
    status.textContent = "Beispieldaten · in der Vorschau ist kein Wetterdienst erreichbar";
    status.className = "status warn";
  } else if (w && (m.stale || (raw && raw.error))) {
    status.textContent = "Offline · Stand " + clock(w.current.time) + (m.stale ? " · Empfehlung für diesen Zeitpunkt" : "");
    status.className = "status warn";
  } else if (w) {
    status.textContent = (loading ? "Aktualisiere … " : "") + "Wetterstand " + clock(w.current.time) + " · " + Math.round(w.min) + "–" + Math.round(w.max) + " °C im Fenster";
  } else {
    status.textContent = "";
  }

  $("fine").innerHTML = fineText(w);
}

function fineText(w) {
  const t = limits(S);
  const p = [];
  if (S.sport === "run") {
    p.push("Deine Jogging-Regeln: über 17 °C Kurzarmshirt, 10 bis 17 °C Langarmshirt, unter 10 °C Langarmshirt und Hoodie. Für das Oberteil zählt die tiefste tatsächliche Temperatur im Fenster. Die Hose richtet sich nach der angepassten Kleidungstemperatur mit Kälteempfinden und Intensität.");
  }
  p.push("Persönliche Schwellen: Regen ab " + t.rain + " mm/h drinnen, Böen-Hinweis ab " + t.gustWarn + " km/h, verschieben ab " + t.gustStop + " km/h, Lichtpuffer " + t.lightBuffer + " Minuten vor Sonnenuntergang. Eigene Vorsichtsregeln, keine offiziellen Sicherheitsgrenzen.");
  p.push("Stündliche Prognosen am gewählten Ort, kein Regenradar und keine amtlichen Warnungen. Alle überlappenden Stunden zählen mit, auch die angrenzende Endstunde. Keine Routenprüfung: Gelände, Sicht und Untergrund selbst beachten.");
  if (w && !w.sunOK) p.push("Sonnenzeiten fehlen: Licht wird vorsorglich empfohlen.");
  p.push("Bei Donner Schutz in einem festen Gebäude suchen und mindestens 30 Minuten nach dem letzten Donner warten.");
  if (S.sport === "swim" && S.kind !== "indoor") p.push("Die Lufttemperatur ersetzt keine Wassertemperatur. Wassertemperatur, Strömung und lokale Bedingungen prüfen. Neoprenbedarf und sichere Schwimmdauer werden nicht beurteilt.");
  p.push('Kleidung sind Komfort-Faustregeln. Wetter: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Orte: GeoNames');
  return p.map(x => `<p>${x}</p>`).join("");
}

// ---------- Hauptansicht: Interaktion ----------
$("sportSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-sport]");
  if (!b) return;
  S.sport = b.dataset.sport; saveSettings(); refresh();
});
function setDuration(n) { S.duration = Math.min(720, Math.max(15, n)); saveSettings(); render(); }
$("durMinus").addEventListener("click", () => setDuration(S.duration - 15));
$("durPlus").addEventListener("click", () => setDuration(S.duration + 15));
$("refresh").addEventListener("click", () => refresh(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });

// ---------- Einstellungen ----------
let draft = null;
function segSync() {
  document.querySelectorAll("#kindSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === draft.kind)));
  document.querySelectorAll("#intSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.int === draft.intensity)));
  document.querySelectorAll("#sensSeg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.sens) === draft.sensitivity)));
}
function openSettings() {
  draft = clone(S);
  $("placeInput").value = draft.place.name;
  $("placeResults").innerHTML = ""; $("placeErr").hidden = true; $("limErr").hidden = true;
  const t = limits(draft);
  $("limRain").value = String(t.rain).replace(".", ",");
  $("limGustWarn").value = t.gustWarn; $("limGustStop").value = t.gustStop; $("limLight").value = t.lightBuffer;
  segSync();
  $("main").hidden = true; $("settings").hidden = false; window.scrollTo(0, 0);
}
function closeSettings() { $("settings").hidden = true; $("main").hidden = false; }
$("openSettings").addEventListener("click", openSettings);
$("closeSettings").addEventListener("click", closeSettings);
$("kindSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { draft.kind = b.dataset.kind; segSync(); } });
$("intSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { draft.intensity = b.dataset.int; segSync(); } });
$("sensSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { draft.sensitivity = Number(b.dataset.sens); segSync(); } });

let searchTimer = null;
$("placeInput").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const name = e.target.value.trim();
  $("placeErr").hidden = true;
  if (name.length < 2) { $("placeResults").innerHTML = ""; return; }
  searchTimer = setTimeout(async () => {
    try {
      const d = await getJSON(url("https://geocoding-api.open-meteo.com/v1/search", { name, count: 6, language: "de", format: "json" }));
      const res = (d.results || []).filter(p => p.timezone);
      if (!res.length) { $("placeResults").innerHTML = ""; $("placeErr").textContent = "Kein Treffer. Bitte einen anderen Ort eingeben."; $("placeErr").hidden = false; return; }
      $("placeResults").innerHTML = res.map((p, i) =>
        `<li><button type="button" data-i="${i}">${esc([p.name, p.admin1, p.country].filter(Boolean).join(", "))}</button></li>`).join("");
      $("placeResults").onclick = ev => {
        const b = ev.target.closest("button"); if (!b) return;
        const p = res[Number(b.dataset.i)];
        draft.place = { name: p.name, latitude: p.latitude, longitude: p.longitude, timezone: p.timezone };
        $("placeInput").value = p.name; $("placeResults").innerHTML = "";
      };
    } catch (err) {
      $("placeErr").textContent = "Ortssuche braucht Netz. " + err.message; $("placeErr").hidden = false;
    }
  }, 300);
});

$("saveSettings").addEventListener("click", () => {
  const num = id => Number($(id).value.trim().replace(",", "."));
  const t = { rain: num("limRain"), gustWarn: num("limGustWarn"), gustStop: num("limGustStop"), lightBuffer: num("limLight") };
  if (!validLimits(t)) {
    $("limErr").textContent = "Bitte prüfen: Regen 0,5–30. Böenhinweis 10–100. Verschieben höher als Hinweis, maximal 120. Lichtpuffer 0–120 ganze Minuten.";
    $("limErr").hidden = false; return;
  }
  const placeChanged = placeKey(draft.place) !== placeKey(S.place);
  S = { ...draft, thresholds: t };
  saveSettings();
  if (placeChanged) raw = null;
  closeSettings();
  refresh(placeChanged);
});

// ---------- Start ----------
render();
refresh();
if ("serviceWorker" in navigator && !IN_FRAME) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
